services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    environment:
      ROLE: ${ROLE:-A}
      MACHINE_ID: ${MACHINE_ID:-fipwave-a}
    command:
      - sh
      - -ec
      - >-
        exec node dist/server/packages/bridge/src/runner.js --machine-id ${MACHINE_ID:-fipwave-a} --role ${ROLE:-A} --port 4310 --report /tmp/loopback-report.json --tun-evidence none --evidence-mode Loopback
    ports:
      - "127.0.0.1:${BROWSER_PORT:-4310}:4310"
    security_opt:
      - no-new-privileges:true
    privileged: false

  fips:
    build:
      context: ./vendor/fips
      dockerfile: Dockerfile
    network_mode: service:bridge
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    privileged: false
    command: ["sleep", "infinity"]
