services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    environment:
      ROLE: ${ROLE:-A}
      MACHINE_ID: ${MACHINE_ID:-fipwave-a}
    command:
      - sh
      - -ec
      - >-
        exec node dist/server/packages/bridge/src/runner.js --machine-id ${MACHINE_ID:-fipwave-a} --role ${ROLE:-A} --bind-host 0.0.0.0 --port 4310 --report /tmp/loopback-report.json --tun-evidence none --evidence-mode Loopback --fips-config /runtime/fips.yaml
    ports:
      - "127.0.0.1:${BROWSER_PORT:-4310}:4310"
    security_opt:
      - no-new-privileges:true
    privileged: false
    # Docker initializes a named volume as root. The bridge is the sole writer
    # of the generated demo config; it has no added Linux capabilities.
    user: "0:0"
    volumes:
      - fips-runtime:/runtime

  fips:
    build:
      context: ./vendor/fips
      dockerfile: Dockerfile
    network_mode: service:bridge
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    privileged: false
    # NET_ADMIN is effective only for the daemon's root process; every other
    # default capability is explicitly dropped above.
    user: "0:0"
    volumes:
      - fips-runtime:/runtime:ro
    command: ["sh", "-ec", "until test -r /runtime/fips.yaml; do sleep 0.1; done; exec /usr/local/bin/fips --config /runtime/fips.yaml"]

volumes:
  fips-runtime:
